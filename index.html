<style>
/* ══ Designsystem „Soll und Haben" v1.0 ══════════════════════════════ */
:root{
  --grund:   #F6F5F1;
  --karte:   #FFFFFF;
  --tinte:   #2A2E35;
  --leise:   #8E9299;
  --linie:   #E4E3DD;
  --spur:    #ECEBE5;

  --rot:     #D9695F;
  --gelb:    #E5B14C;
  --blau:    #3F72C4;
  --gruen:   #5AA678;
  --blau-t:  #E8EEF9;

  --s: 'Avenir Next', 'Avenir', 'Nunito', system-ui, -apple-system, sans-serif;
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  background:var(--grund); font-family:var(--s); color:var(--tinte);
  font-size:16px; -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top);
}
button{ font-family:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--blau); outline-offset:2px; }

.blatt{ width:min(390px,100%); margin:0 auto; padding-bottom:calc(28px + env(safe-area-inset-bottom)); }

/* ── Kopf ── */
.kopf{ padding:22px 24px 8px; display:flex; justify-content:space-between; align-items:flex-start; }
.kopf h1{ font-size:20px; font-weight:600; letter-spacing:-.005em; line-height:1; }
.kopf h1 span{ font-weight:400; color:var(--leise); font-size:16px; }
.kopf .unterzeile{ font-size:11px; color:var(--leise); margin-top:4px; letter-spacing:.02em; }
.kopf .mehr{ background:none; border:none; font-size:11.5px; color:var(--leise); padding:2px 0; }

/* ── Ring ── */
.kuchen{ position:relative; display:flex; justify-content:center; padding:6px 0 2px; }
svg{ display:block; overflow:visible; }
.seg{ transition:stroke-dasharray .6s cubic-bezier(.34,.8,.3,1),
                 stroke-dashoffset .6s cubic-bezier(.34,.8,.3,1), opacity .4s; }
.mitte{ position:absolute; inset:0; display:flex; flex-direction:column;
        align-items:center; justify-content:center; pointer-events:none; }
.mitte .label{ font-size:10.5px; letter-spacing:.1em; color:var(--leise); font-weight:600; }
.mitte .netto{ font-size:34px; font-weight:600; letter-spacing:-.025em;
               font-variant-numeric:tabular-nums; transition:color .5s; margin-top:3px; }
.mitte .fort{ font-size:11.5px; color:var(--leise); margin-top:5px; }

/* ── Der Moment beim Erreichen (F5) ──
   Eine Zeile über dem Ring. Kein Ton, kein Konfetti, keine Bestätigung.
   Sie blockiert nichts: pointer-events bleiben aus.                     */
.moment{ position:absolute; inset:0; display:flex; flex-direction:column;
         align-items:center; justify-content:center; pointer-events:none;
         opacity:0; transition:opacity .34s ease; z-index:5; }
.moment.auf{ opacity:1; }
.moment .flaeche{ background:var(--grund); border-radius:20px; padding:16px 22px;
                  text-align:center; box-shadow:0 2px 18px rgba(42,46,53,.13);
                  transform:scale(.94); transition:transform .34s cubic-bezier(.34,.8,.3,1); }
.moment.auf .flaeche{ transform:scale(1); }
.moment .oben{ font-size:10.5px; font-weight:700; letter-spacing:.16em;
               color:var(--leise); text-transform:uppercase; }
.moment .name{ font-size:21px; font-weight:600; margin-top:5px; letter-spacing:-.01em; }
.moment .zusatz{ font-size:11.5px; color:var(--blau); margin-top:7px; font-weight:600; }

/* ── Verlauf ── */
.verlauf{ background:var(--karte); border-radius:16px; padding:14px 12px 10px;
          box-shadow:0 1px 3px rgba(42,46,53,.07); margin-bottom:12px; }
.verlauf svg{ width:100%; height:auto; display:block; }
.v-linie{ fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.v-punkt{ stroke:var(--karte); stroke-width:1.5; }
.v-achse{ stroke:var(--linie); stroke-width:1; }
.v-text{ font-size:9px; fill:var(--leise); font-family:var(--s); }
.v-legende{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap;
            margin-top:4px; }
.v-l{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--leise); }
.v-l i{ width:9px; height:9px; border-radius:50%; display:block; }
.v-l b{ font-weight:600; color:var(--tinte); font-variant-numeric:tabular-nums; }

/* ── Positionen ── */
.liste{ padding:10px 18px 0; }
.gruppe{ font-size:10.5px; font-weight:700; letter-spacing:.14em; color:var(--leise);
         text-transform:uppercase; margin:6px 0 7px 4px; }
.gruppe:not(:first-child){ margin-top:14px; }
.pos{ background:var(--karte); border:none; width:100%; text-align:left;
      border-radius:16px; padding:13px 16px; margin-bottom:8px;
      display:flex; align-items:center; gap:12px; box-shadow:0 1px 3px rgba(42,46,53,.07);
      transition:opacity .4s, transform .12s; }
.pos:active{ transform:scale(.985); }
.punkt{ width:11px; height:11px; border-radius:50%; flex:none; }
.punkt.ring{ background:transparent !important; border:3px solid; }
.pos .txt{ flex:1; min-width:0; }
.pos .name{ font-size:13.5px; font-weight:600; }
.pos .unter{ font-size:11px; color:var(--leise); margin-top:1px; }
.pos .wert{ font-size:18px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
.pos.zu{ opacity:.45; }

.faden{ height:3px; border-radius:2px; background:var(--spur); margin-top:6px; overflow:hidden; }
.faden i{ display:block; height:100%; background:var(--gelb); border-radius:2px;
          transition:width .6s cubic-bezier(.34,.8,.3,1); }

/* ── Nächste Marke ── */
.marke{ margin:6px 18px 0; background:var(--blau-t); border:none; width:calc(100% - 36px);
        border-radius:16px; padding:14px 16px; text-align:left;
        display:flex; justify-content:space-between; align-items:center;
        transition:transform .12s; }
.marke:active{ transform:scale(.985); }
.marke .was{ font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--blau); }
.marke .m-unter{ font-size:11.5px; color:var(--leise); margin-top:2px; }
.marke .rest{ font-size:17px; font-weight:600; color:var(--blau);
              font-variant-numeric:tabular-nums; white-space:nowrap; padding-left:10px; }

/* ── Marken-Liste im Zettel ── */
.mk{ display:flex; align-items:center; gap:10px; background:var(--karte);
     border-radius:14px; padding:11px 14px; margin-bottom:7px;
     box-shadow:0 1px 3px rgba(42,46,53,.07); }
.mk .mk-txt{ flex:1; min-width:0; }
.mk .mk-name{ font-size:13px; font-weight:600; }
.mk .mk-unter{ font-size:11px; color:var(--leise); margin-top:1px; }
.mk .mk-betrag{ font-size:15.5px; font-weight:600; font-variant-numeric:tabular-nums; }
.mk button{ background:none; border:none; font-size:11.5px; color:var(--blau);
            padding:4px 2px 4px 8px; }
.mk.erreicht .mk-betrag{ color:var(--gruen); }
.mk.erreicht .mk-name{ color:var(--leise); }

/* ── Knöpfe ── */
.knoepfe{ display:flex; gap:8px; padding:16px 18px 4px; }
.knopf{ flex:1; border:none; background:var(--karte); border-radius:14px; padding:13px 2px;
        font-size:11.5px; font-weight:600; box-shadow:0 1px 3px rgba(42,46,53,.07);
        transition:transform .12s; }
.knopf:active{ transform:scale(.97); }
.knopf.zu{ color:#B9BDC2; }

/* ── Zettel (Overlay) ── */
.schleier{ position:fixed; inset:0; background:rgba(42,46,53,.32); opacity:0;
           pointer-events:none; transition:opacity .28s; z-index:10; }
.schleier.auf{ opacity:1; pointer-events:auto; }
.zettel{ position:fixed; left:0; right:0; bottom:0; z-index:11;
         background:var(--grund); border-radius:26px 26px 0 0;
         padding:22px 22px calc(22px + env(safe-area-inset-bottom));
         transform:translateY(100%); transition:transform .32s cubic-bezier(.32,.72,.3,1);
         max-height:88vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
         width:min(390px,100%); margin:0 auto; }
.zettel.auf{ transform:translateY(0); }
.z-griff{ width:36px; height:4px; border-radius:2px; background:var(--linie);
          margin:-6px auto 14px; }
.z-titel{ font-size:17px; font-weight:600; margin-bottom:3px; }
.z-unter{ font-size:11.5px; color:var(--leise); margin-bottom:16px; }

label{ display:block; font-size:10.5px; font-weight:700; letter-spacing:.1em;
       color:var(--leise); text-transform:uppercase; margin:0 0 6px 2px; }
input[type=date], input[type=text]{
  width:100%; border:none; background:var(--karte); border-radius:14px;
  padding:13px 15px; font-family:inherit; font-size:16px; color:var(--tinte);
  box-shadow:0 1px 3px rgba(42,46,53,.07); margin-bottom:14px;
  font-variant-numeric:tabular-nums; -webkit-appearance:none;
}
input:disabled{ opacity:.5; }
.betragsfeld{ font-size:26px !important; font-weight:600; letter-spacing:-.02em; }

.z-knoepfe{ display:flex; gap:9px; margin-top:4px; }
.z-knopf{ flex:1; border:none; border-radius:15px; padding:15px 4px;
          font-size:13.5px; font-weight:600; transition:transform .12s; }
.z-knopf:active{ transform:scale(.97); }
.z-knopf.primaer{ background:var(--blau); color:#fff; }
.z-knopf.leise{ background:var(--karte); color:var(--tinte); box-shadow:0 1px 3px rgba(42,46,53,.07); }
.z-knopf.gefahr{ background:var(--karte); color:var(--rot); box-shadow:0 1px 3px rgba(42,46,53,.07); }

.eintraege{ margin:4px 0 16px; }
.eintrag{ display:flex; align-items:center; gap:10px; background:var(--karte);
          border-radius:14px; padding:11px 14px; margin-bottom:7px;
          box-shadow:0 1px 3px rgba(42,46,53,.07); }
.eintrag .e-datum{ font-size:12.5px; color:var(--leise); flex:1;
                   font-variant-numeric:tabular-nums; }
.eintrag .e-betrag{ font-size:15.5px; font-weight:600; font-variant-numeric:tabular-nums; }
.eintrag button{ background:none; border:none; font-size:11.5px; color:var(--blau);
                 padding:4px 2px 4px 8px; }

<body>

<div class="blatt">
  <div class="kopf">
    <div>
      <h1>Soll <span>und</span> Haben</h1>
      <div class="unterzeile">Schulden, Rücklage, Depot</div>
    </div>
    <div style="display:flex; gap:12px">
      <button class="mehr" onclick="oeffneVerlauf()">Verlauf</button>
      <button class="mehr" onclick="oeffneVerwaltung()">Sicherung</button>
    </div>
  </div>

  <div class="kuchen">

        <circle class="seg" id="sGelb" cx="131" cy="131" r="90" stroke="var(--gelb)"/>

    <div class="gruppe">Haben</div>

      <span class="punkt" style="background:var(--gelb)"></span>
      <span class="txt">
        <span class="name">Notgroschen</span>
        <div class="unter" id="uGelb">noch 500 € bis zur ersten Marke</div>
        <div class="faden"><i id="fGelb" style="width:0%"></i></div>
      </span>

      <span class="txt"><span class="name">Depotwert</span><div class="unter" id="uBlau">noch nichts eingetragen</div></span>

      <span class="txt"><span class="name">Aus eBay eingezahlt</span><div class="unter" id="uGruen">äußerer Ring</div></span>
      <span class="wert" id="wGruen">—</span>

  <button class="marke" id="band" onclick="oeffneMarken()">

    <span class="rest" id="mRest"></span>
  </button>

  <div class="knoepfe">
    <button class="knopf" onclick="oeffneEintrag('schulden')">Schulden</button>
    <button class="knopf" onclick="oeffneEintrag('notgroschen')">Notgroschen</button>
    <button class="knopf" id="kDepot" onclick="oeffneEintrag('depot')">Depot</button>

<div class="schleier" id="schleier" onclick="schliesseZettel()"></div>
<div class="zettel" id="zettel" role="dialog" aria-modal="true"></div>
<div class="quittung" id="quittung"></div>

<script>
'use strict';

/* ══ Grundlagen ═══════════════════════════════════════════════════════
   Datenmodell nach Datei 04, Datenschema 1.                           */

const SCHEMA_VERSION = 1;
const FASSUNG        = '0.5.1';
const SPEICHER       = 'suh_data_v1';

const ARTEN = {
  schulden:    { name: 'Schulden',   farbe: 'rot'   },
  notgroschen: { name: 'Notgroschen',farbe: 'gelb'  },
  depot:       { name: 'Depotwert',  farbe: 'blau'  }
};

const MARKE_PUFFER = 500;
const MARKE_VOLL   = 3000;

/* ── Darstellung von Beträgen ──
   Deutsches Format, ohne Nachkommastellen, echtes Minuszeichen (U+2212). */
function euro(n){
  const v = Math.round(Math.abs(n)).toLocaleString('de-DE');
  return (n < 0 ? '\u2212' : '') + v + ' €';
}
function datumLang(iso){
  const [j,m,t] = iso.split('-');
  const monate = ['Januar','Februar','März','April','Mai','Juni','Juli',
                  'August','September','Oktober','November','Dezember'];
  return parseInt(t,10) + '. ' + monate[parseInt(m,10)-1] + ' ' + j;
}
function heute(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
function neueId(praefix){
  return praefix + '_' + Math.random().toString(36).slice(2,8);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ══ Bestand ══════════════════════════════════════════════════════════ */

function leererBestand(){
  return {
    schemaVersion: SCHEMA_VERSION,
    fassung: FASSUNG,
    staende: [],
    erloese: [],
    marken: [
      { id:'m_puffer', art:'notgroschen', betrag:500,  fest:true,  erreichtAm:null },
      { id:'m_voll',   art:'notgroschen', betrag:3000, fest:true,  erreichtAm:null },
      { id:'m_s6000',  art:'schulden',    betrag:6000, fest:false, erreichtAm:null },
      { id:'m_s4000',  art:'schulden',    betrag:4000, fest:false, erreichtAm:null },
      { id:'m_s2000',  art:'schulden',    betrag:2000, fest:false, erreichtAm:null },
      { id:'m_frei',   art:'schulden',    betrag:0,    fest:true,  erreichtAm:null }
    ],
    einstellungen: { letzteSicherung:null }
  };
}

/* Migrationen: es gibt noch keine. Der Mechanismus steht trotzdem —
   jeder Schritt ist idempotent und ergänzt, statt zu ersetzen. Ein
   höherer Wert als bekannt führt zu einer Meldung und KEINEM Schreiben. */
function migriere(d){
  const basis = leererBestand();
  if (typeof d.schemaVersion !== 'number') d.schemaVersion = SCHEMA_VERSION;
  if (d.schemaVersion > SCHEMA_VERSION){
    throw new Error('Der Datenbestand stammt aus einer neueren Fassung '
      + '(Schema ' + d.schemaVersion + '). Diese Fassung kennt Schema '
      + SCHEMA_VERSION + ' und schreibt nichts, um nichts zu zerstören.');
  }
  d.staende       = Array.isArray(d.staende) ? d.staende : [];
  d.erloese       = Array.isArray(d.erloese) ? d.erloese : [];
  d.marken        = Array.isArray(d.marken) && d.marken.length ? d.marken : basis.marken;
  d.einstellungen = d.einstellungen || basis.einstellungen;
  d.fassung       = FASSUNG;
  d.schemaVersion = SCHEMA_VERSION;
  return d;
}

let daten = lade();
let fehlerBeimLaden = null;

function lade(){
  try{
    const roh = localStorage.getItem(SPEICHER);
    if (!roh) return leererBestand();
    return migriere(JSON.parse(roh));
  }catch(e){
    fehlerBeimLaden = e.message || 'Der Datenbestand ließ sich nicht lesen.';
    return leererBestand();
  }
}

function speichere(){
  if (fehlerBeimLaden) return;   // nie über einen unlesbaren Bestand schreiben
  try{
    localStorage.setItem(SPEICHER, JSON.stringify(daten));
  }catch(e){
    zeigeQuittung('Konnte nicht gespeichert werden.');
  }
}

/* ══ Berechnungen (Datei 04, Abschnitt 3) ═════════════════════════════ */

function eintraege(art){
  return daten.staende
    .filter(s => s.art === art)
    .sort((a,b) => b.datum.localeCompare(a.datum)
                || String(b.erfasstAm).localeCompare(String(a.erfasstAm)));
}

/* Der jüngste Eintrag gilt; bei gleichem Datum der später erfasste. */
function aktuellerStand(art){
  const liste = eintraege(art);
  return liste.length ? liste[0].betrag : 0;
}
function hatStand(art){
  return daten.staende.some(s => s.art === art);
}

function vermoegen(){
  return aktuellerStand('notgroschen') + aktuellerStand('depot') - aktuellerStand('schulden');
}

/* Bezugspunkt ist der älteste eingetragene Schuldenstand. Wird er
   gelöscht, springt der Prozentsatz — bewusst hingenommen (Datei 04). */
function ersterSchuldenstand(){
  const liste = daten.staende.filter(s => s.art === 'schulden')
    .sort((a,b) => a.datum.localeCompare(b.datum)
                || String(a.erfasstAm).localeCompare(String(b.erfasstAm)));
  return liste.length ? liste[0].betrag : 0;
}
function getilgtAnteil(){
  const start = ersterSchuldenstand();
  if (start <= 0) return null;
  return 1 - aktuellerStand('schulden') / start;
}

function eingezahlt(){
  return daten.erloese.reduce((s,e) => s + e.betrag, 0);
}

/* ══ Marken (Datei 04, Abschnitt 3) ═══════════════════════════════════ */

/* Feste Reihenfolge: Puffer, dann die Schulden-Marken absteigend, dann
   der volle Notgroschen. Angezeigt wird stets genau eine (F4.5).        */
function markenInReihenfolge(){
  const m = daten.marken;
  const puffer = m.filter(x => x.id === 'm_puffer');
  const voll   = m.filter(x => x.id === 'm_voll');
  const schuld = m.filter(x => x.art === 'schulden')
                  .sort((a,b) => b.betrag - a.betrag);
  return puffer.concat(schuld, voll);
}

function naechsteMarke(){
  return markenInReihenfolge().find(m => !m.erreichtAm) || null;
}

/* Die Freischaltung hängt an der MARKE, nicht am Kontostand. Sinkt der
   Notgroschen später wieder unter 500 €, bleibt alles offen — eine
   erreichte Marke wird nie ungültig (Lastenheft F4.4).                  */
function freigeschaltet(){
  const p = daten.marken.find(m => m.id === 'm_puffer');
  return !!(p && p.erreichtAm);
}

/* Nach jedem Eintragen oder Ändern eines Standes. Gibt die höchste neu
   erreichte Marke zurück, damit v0.4 daran anknüpfen kann.
   Wichtig: ohne eingetragenen Stand wird nichts geprüft — sonst gälte
   ein Schuldenstand von 0 als schuldenfrei, bevor je etwas dastand.     */
function pruefeMarken(ausloesendesDatum){
  const datum = ausloesendesDatum || heute();
  let hoechste = null;
  for (const m of daten.marken){
    if (m.erreichtAm) continue;
    if (!hatStand(m.art)) continue;
    const stand = aktuellerStand(m.art);
    const erreicht = m.art === 'schulden' ? stand <= m.betrag : stand >= m.betrag;
    if (!erreicht) continue;
    m.erreichtAm = datum;
    if (!hoechste || m.betrag > hoechste.betrag) hoechste = m;
  }
  return hoechste;
}

function markeName(m){
  if (m.id === 'm_puffer') return 'Puffer';
  if (m.id === 'm_voll')   return 'Notgroschen voll';
  if (m.id === 'm_frei')   return 'Schuldenfrei';
  return 'Schulden unter ' + euro(m.betrag);
}

/* ══ Das Bild ═════════════════════════════════════════════════════════ */

const U_INNEN = 2 * Math.PI * 90;
const U_AUSSEN = 2 * Math.PI * 117;

function setzeSeg(el, anteilStart, anteil, umfang, luecke){
  const l = anteil > 0.004 ? luecke : 0;
  const laenge = Math.max(0, anteil * umfang - l);
  el.style.strokeDasharray  = laenge + ' ' + (umfang - laenge);
  el.style.strokeDashoffset = -(anteilStart * umfang) - (l / 2);
  el.style.opacity = anteil <= 0.002 ? 0 : 1;
}

function zeichneRing(){
  const schuld = aktuellerStand('schulden');
  const not    = aktuellerStand('notgroschen');
  const depot  = aktuellerStand('depot');
  const summe  = (schuld + not + depot) || 1;

  let lauf = 0, depotStart = 0;
  [['sRot',schuld], ['sGelb',not], ['sBlau',depot]].forEach(([id,wert]) => {
    const a = wert / summe;
    if (id === 'sBlau') depotStart = lauf;
    setzeSeg(document.getElementById(id), lauf, a, U_INNEN, 5);
    lauf += a;
  });

  /* Der äußere Ring beginnt dort, wo das Depot beginnt — damit sich die
     Bogenlängen vergleichen lassen (Designsystem 4.1). Ab v0.3 gefüllt. */
  setzeSeg(document.getElementById('sGruen'), depotStart, eingezahlt()/summe, U_AUSSEN, 4);
}

function zeichne(){
  zeichneRing();

  const nEl = document.getElementById('netto');
  const hatEtwas = daten.staende.length > 0;
  const v = vermoegen();
  nEl.textContent = hatEtwas ? euro(v) : '—';
  nEl.style.color = hatEtwas ? (v >= 0 ? 'var(--blau)' : 'var(--rot)') : 'var(--leise)';

  const anteil = getilgtAnteil();
  document.getElementById('fort').textContent =
    anteil === null ? 'noch kein Schuldenstand eingetragen'
                    : Math.round(100*anteil) + ' % der Schulden getilgt';

  /* Schulden */
  const schuld = aktuellerStand('schulden');
  document.getElementById('wRot').textContent = hatStand('schulden') ? euro(schuld) : '—';
  document.getElementById('uRot').textContent = !hatStand('schulden')
    ? 'noch nichts eingetragen'
    : (schuld === 0 ? 'getilgt' : letzteAenderung('schulden'));

  /* Notgroschen */
  const not = aktuellerStand('notgroschen');
  document.getElementById('wGelb').textContent = hatStand('notgroschen') ? euro(not) : '—';
  document.getElementById('fGelb').style.width = Math.min(100, not / MARKE_VOLL * 100) + '%';
  document.getElementById('uGelb').textContent =
    not >= MARKE_VOLL ? 'vollständig aufgefüllt'
    : (not >= MARKE_PUFFER ? 'noch ' + euro(MARKE_VOLL - not) + ' bis 3.000'
                           : 'noch ' + euro(MARKE_PUFFER - not) + ' bis zur ersten Marke');

  /* Depot — gesperrt, bis die Puffer-Marke erreicht ist (F8.1).
     Die Sperre betrifft das EINTRAGEN. Was bereits eingetragen wurde,
     bleibt sichtbar; nichts verschwindet stillschweigend (N6).          */
  const depot = aktuellerStand('depot');
  const frei  = freigeschaltet();
  const zeigeDepot = hatStand('depot');
  document.getElementById('wBlau').textContent = zeigeDepot ? euro(depot) : '—';
  document.getElementById('uBlau').textContent = zeigeDepot
    ? letzteAenderung('depot')
    : (frei ? 'noch nichts eingetragen' : 'wartet auf die erste Marke');
  document.getElementById('pBlau').classList.toggle('zu', !frei && !zeigeDepot);
  document.getElementById('kDepot').classList.toggle('zu', !frei);

  /* Aus eBay eingezahlt — der äußere Ring (F2.2). */
  const ein = eingezahlt();
  const zeigeEbay = daten.erloese.length > 0;
  document.getElementById('wGruen').textContent = zeigeEbay ? euro(ein) : '—';
  document.getElementById('uGruen').textContent = zeigeEbay
    ? daten.erloese.length + (daten.erloese.length === 1 ? ' Verkauf' : ' Verkäufe')
      + ' — wandert ins Depot'
    : (frei ? 'aus Verkäufen — wandert ins Depot'
            : 'äußerer Ring · wartet auf die erste Marke');
  document.getElementById('pGruen').classList.toggle('zu', !frei && !zeigeEbay);

  /* Der Vergleich zum Einstand in Worten (F3.5). Er ersetzt die Zeile
     unter dem Depot, sobald beide Zahlen vorliegen — das ist die einzige
     Aussage, die sonst nur im Bild steht.                               */
  if (frei && zeigeEbay && zeigeDepot){
    const diff = depot - ein;
    document.getElementById('uBlau').textContent =
      Math.round(diff) === 0 ? 'genau auf Einstand'
      : (diff > 0 ? 'der Markt hat ' + euro(diff) + ' draufgelegt'
                  : euro(-diff) + ' unter Einstand');
  }

  zeichneBand();
}

function zeichneBand(){
  const band = document.getElementById('band');
  const m = naechsteMarke();

  if (!m){
    document.getElementById('mWas').textContent   = 'ALLE MARKEN ERREICHT';
    document.getElementById('mUnter').textContent = 'ab jetzt kommt das Gehalt dazu';
    document.getElementById('mRest').textContent  = '';
    return;
  }

  const stand = aktuellerStand(m.art);
  const offen = m.art === 'schulden'
    ? Math.max(0, stand - m.betrag)
    : Math.max(0, m.betrag - stand);

  let was, unter;
  if (m.id === 'm_puffer'){ was = 'ERSTE MARKE · PUFFER';  unter = 'schaltet das Depot frei'; }
  else if (m.id === 'm_voll'){ was = 'LETZTE MARKE · NOTGROSCHEN'; unter = 'danach muss nie wieder verkauft werden'; }
  else if (m.id === 'm_frei'){ was = 'NÄCHSTE MARKE · SCHULDENFREI'; unter = 'dann zählt nur noch, was wächst'; }
  else { was = 'NÄCHSTE MARKE'; unter = 'Schulden unter ' + euro(m.betrag); }

  document.getElementById('mWas').textContent   = was;
  document.getElementById('mUnter').textContent = unter;
  document.getElementById('mRest').textContent  =
    hatStand(m.art) ? 'noch ' + euro(offen) : euro(m.betrag);
}

function letzteAenderung(art){
  const liste = eintraege(art);
  if (liste.length < 2) return 'seit ' + datumLang(liste[0].datum);
  const diff = liste[0].betrag - liste[1].betrag;
  if (Math.round(diff) === 0) return 'unverändert';
  const richtung = diff > 0 ? '+' : '\u2212';
  return richtung + euro(Math.abs(diff)).replace('\u2212','') + ' seit dem letzten Eintrag';
}

/* ══ Der Verlauf (F6.2) ═══════════════════════════════════════════════
   Die drei Stände über die Zeit, als schlichte Linien in ihren
   Positionsfarben. SVG von Hand, keine Bibliothek.

   Eine gemeinsame Skala für alle drei. Getrennte Achsen würden den
   Notgroschen größer erscheinen lassen, als er ist — und gerade das
   Verhältnis ist die Aussage: Rot fällt, die anderen wachsen ihm
   entgegen.                                                            */

const V_BREITE = 322, V_HOEHE = 150, V_RAND_L = 4, V_RAND_R = 4,
      V_RAND_O = 10, V_RAND_U = 16;

function verlaufsReihen(){
  const reihen = [];
  for (const art of ['schulden','notgroschen','depot']){
    const punkte = daten.staende.filter(s => s.art === art)
      .sort((a,b) => a.datum.localeCompare(b.datum)
                  || String(a.erfasstAm).localeCompare(String(b.erfasstAm)));
    /* Bei mehreren Einträgen am selben Tag gilt der später erfasste. */
    const je = new Map();
    for (const p of punkte) je.set(p.datum, p.betrag);
    reihen.push({
      art: art,
      farbe: 'var(--' + ARTEN[art].farbe + ')',
      name: ARTEN[art].name,
      punkte: Array.from(je, ([datum, betrag]) => ({ datum, betrag }))
    });
  }
  return reihen;
}

function zeichneVerlauf(){
  const reihen = verlaufsReihen();
  const alle = reihen.flatMap(r => r.punkte);
  if (alle.length < 2) return null;

  const tage = alle.map(p => Date.parse(p.datum + 'T00:00:00Z'));
  const von = Math.min.apply(null, tage), bis = Math.max.apply(null, tage);
  const spanne = Math.max(1, bis - von);
  const max = Math.max.apply(null, alle.map(p => p.betrag)) || 1;

  const iB = V_BREITE - V_RAND_L - V_RAND_R;
  const iH = V_HOEHE  - V_RAND_O - V_RAND_U;
  const x = iso => V_RAND_L + (Date.parse(iso + 'T00:00:00Z') - von) / spanne * iB;
  const y = wert => V_RAND_O + iH - (wert / max) * iH;

  let svg = '<svg viewBox="0 0 ' + V_BREITE + ' ' + V_HOEHE + '" role="img" '
          + 'aria-label="Verlauf der drei Stände">';

  /* Grundlinie bei null */
  svg += '<line class="v-achse" x1="' + V_RAND_L + '" y1="' + y(0) + '" x2="'
       + (V_BREITE - V_RAND_R) + '" y2="' + y(0) + '"/>';

  for (const r of reihen){
    if (r.punkte.length === 0) continue;
    if (r.punkte.length > 1){
      const d = r.punkte.map(p => x(p.datum).toFixed(1) + ',' + y(p.betrag).toFixed(1)).join(' ');
      svg += '<polyline class="v-linie" points="' + d + '" stroke="' + r.farbe + '"/>';
    }
    for (const p of r.punkte){
      svg += '<circle class="v-punkt" cx="' + x(p.datum).toFixed(1) + '" cy="'
           + y(p.betrag).toFixed(1) + '" r="2.6" fill="' + r.farbe + '"/>';
    }
  }

  const alsIso = ms => new Date(ms).toISOString().slice(0,10);
  const kurz = iso => { const [j,m,t] = iso.split('-'); return t + '.' + m + '.'; };
  svg += '<text class="v-text" x="' + V_RAND_L + '" y="' + (V_HOEHE - 3) + '">'
       + kurz(alsIso(von)) + '</text>';
  svg += '<text class="v-text" x="' + (V_BREITE - V_RAND_R) + '" y="' + (V_HOEHE - 3)
       + '" text-anchor="end">' + kurz(alsIso(bis)) + '</text>';
  svg += '<text class="v-text" x="' + V_RAND_L + '" y="' + (V_RAND_O - 2) + '">'
       + euro(max) + '</text>';
  svg += '</svg>';

  return { svg: svg, reihen: reihen, max: max };
}

function oeffneVerlauf(){
  const v = zeichneVerlauf();

  let html = '<div class="z-titel">Verlauf</div>';
  html += '<div class="z-unter">Die drei Stände über die Zeit, gemeinsame Skala.</div>';

  if (!v){
    html += '<div class="leer">Der Verlauf beginnt beim zweiten Eintrag.</div>';
  } else {
    html += '<div class="verlauf">' + v.svg;
    html += '<div class="v-legende">';
    for (const r of v.reihen){
      if (r.punkte.length === 0) continue;
      const letzter = r.punkte[r.punkte.length - 1];
      html += '<span class="v-l"><i style="background:' + r.farbe + '"></i>'
            + escapeHtml(r.name) + ' <b>' + euro(letzter.betrag) + '</b></span>';
    }
    html += '</div></div>';
    html += '<p class="hinweis">Alle drei Linien teilen sich eine Achse. '
          + 'Getrennte Skalen ließen den Notgroschen größer aussehen, als er ist — '
          + 'und gerade das Verhältnis ist die Aussage.</p>';
  }

  html += '<div class="z-knoepfe">';
  html += '<button class="z-knopf leise" onclick="schliesseZettel()">Schließen</button>';
  html += '</div>';
  oeffneZettel(html);
}

/* ══ Der Moment beim Erreichen (F5) ═══════════════════════════════════
   Er dauert unter zwei Sekunden, verlangt keine Bestätigung, blockiert
   nichts und lässt sich nicht wiederholen — sobald `erreichtAm` steht,
   kann er für diese Marke nie wieder auslösen.                         */

let momentZeit = null;

function zeigeMoment(marke, auchFreigeschaltet){
  const el = document.getElementById('moment');
  document.getElementById('momentName').textContent = markeName(marke);
  document.getElementById('momentZusatz').textContent =
    auchFreigeschaltet ? 'Das Depot ist freigeschaltet.' : '';

  clearTimeout(momentZeit);
  el.classList.add('auf');
  momentZeit = setTimeout(() => el.classList.remove('auf'), 1500);
}

/* ══ Die Chronik (F6.1) ═══════════════════════════════════════════════
   Alle erreichten Marken mit Datum, die jüngste oben. Sie ist die
   dauerhafte Belohnung: eine Liste, die wächst und nie verschwindet.   */

function chronik(){
  return daten.marken.filter(m => m.erreichtAm)
    .sort((a,b) => b.erreichtAm.localeCompare(a.erreichtAm)
                || b.betrag - a.betrag);
}

function tageZwischen(vonIso, bisIso){
  const ms = Date.parse(bisIso + 'T00:00:00Z') - Date.parse(vonIso + 'T00:00:00Z');
  return Math.round(ms / 86400000);
}

function oeffneChronik(){
  const liste = chronik();
  let html = '<div class="z-titel">Chronik</div>';
  html += '<div class="z-unter">'
        + (liste.length === 0 ? 'Noch keine Marke erreicht.'
           : liste.length + (liste.length === 1 ? ' Marke erreicht' : ' Marken erreicht'))
        + '</div>';

  if (liste.length === 0){
    html += '<div class="leer">Die erste kommt bei 500 € Notgroschen.</div>';
  } else {
    html += '<div class="eintraege">';
    liste.forEach((m, i) => {
      const vorher = liste[i+1];
      const tage = vorher ? tageZwischen(vorher.erreichtAm, m.erreichtAm) : null;
      html += '<div class="mk erreicht">';
      html += '<span class="mk-txt"><span class="mk-name" style="color:var(--tinte)">'
            + escapeHtml(markeName(m)) + '</span>'
            + '<div class="mk-unter">' + datumLang(m.erreichtAm)
            + (tage !== null ? ' · ' + (tage === 0 ? 'am selben Tag'
                : tage + (tage === 1 ? ' Tag' : ' Tage') + ' später') : '')
            + '</div></span>';
      html += '<span class="mk-betrag">' + euro(m.betrag) + '</span>';
      html += '</div>';
    });
    html += '</div>';

    const erste = liste[liste.length-1], letzte = liste[0];
    if (liste.length > 1){
      html += '<p class="hinweis">Von der ersten bis zur letzten Marke: '
            + tageZwischen(erste.erreichtAm, letzte.erreichtAm) + ' Tage.</p>';
    }
  }

  html += '<div class="z-knoepfe">';
  html += '<button class="z-knopf leise" onclick="oeffneMarken()">Zurück</button>';
  html += '<button class="z-knopf primaer" onclick="schliesseZettel()">Schließen</button>';
  html += '</div>';
  oeffneZettel(html);
}

/* ══ Zettel ═══════════════════════════════════════════════════════════ */

const elSchleier = document.getElementById('schleier');
const elZettel   = document.getElementById('zettel');

function oeffneZettel(html){
  elZettel.innerHTML = '<div class="z-griff"></div>' + html;
  elSchleier.classList.add('auf');
  elZettel.classList.add('auf');
}
function schliesseZettel(){
  elSchleier.classList.remove('auf');
  elZettel.classList.remove('auf');
}
let quittungZeit = null;
function zeigeQuittung(text){
  const q = document.getElementById('quittung');
  q.textContent = text;
  q.classList.add('auf');
  clearTimeout(quittungZeit);
  quittungZeit = setTimeout(() => q.classList.remove('auf'), 1900);
}

/* ══ Eintragen ════════════════════════════════════════════════════════ */

let bearbeiteId = null;

function oeffneEintrag(art, id){
  if (art === 'depot' && !freigeschaltet()){
    const fehlt = Math.max(0, 500 - aktuellerStand('notgroschen'));
    oeffneZettel('<div class="z-titel">Noch gesperrt</div>'
      + '<div class="z-unter">Das Depot wartet auf die erste Marke.</div>'
      + '<p class="hinweis">Investiert wird erst ab 500 € Notgroschen. '
      + 'Es fehlen noch <b>' + euro(fehlt) + '</b>.<br><br>'
      + 'Das ist keine Empfehlung der App, sondern die Regel, die du dir gegeben hast — '
      + 'und der Grund, warum die ersten 500 € überhaupt eine Marke sind.</p>'
      + '<div class="z-knoepfe">'
      + '<button class="z-knopf leise" onclick="schliesseZettel()">Schließen</button>'
      + '<button class="z-knopf primaer" onclick="oeffneEintrag(\'notgroschen\')">Notgroschen eintragen</button>'
      + '</div>');
    return;
  }
  bearbeiteId = id || null;
  const a = ARTEN[art];
  const vorhandener = id ? daten.staende.find(s => s.id === id) : null;
  const vorbelegung = vorhandener ? vorhandener.betrag
                    : (hatStand(art) ? aktuellerStand(art) : '');

  let html = '<div class="z-titel">' + (id ? 'Eintrag ändern' : a.name + ' eintragen') + '</div>';
  html += '<div class="z-unter">'
        + (art === 'schulden'
            ? 'Der offene Betrag, als positive Zahl.'
            : 'Der Stand, wie er heute ist.')
        + '</div>';

  html += '<label for="fBetrag">Betrag</label>';
  html += '<input type="text" inputmode="decimal" id="fBetrag" class="betragsfeld" '
        + 'value="' + (vorbelegung === '' ? '' : String(vorbelegung).replace('.',',')) + '" '
        + 'placeholder="0">';

  html += '<label for="fDatum">Datum</label>';
  html += '<input type="date" id="fDatum" value="'
        + escapeHtml(vorhandener ? vorhandener.datum : heute()) + '">';

  html += '<div class="z-knoepfe">';
  html += '<button class="z-knopf leise" onclick="schliesseZettel()">Abbrechen</button>';
  html += '<button class="z-knopf primaer" onclick="sichereStand(\'' + art + '\')">'
        + (id ? 'Ändern' : 'Eintragen') + '</button>';
  html += '</div>';

  oeffneZettel(html);
  setTimeout(() => {
    const f = document.getElementById('fBetrag');
    if (f) { f.focus(); f.select(); }
  }, 340);
}

function leseBetrag(){
  const roh = (document.getElementById('fBetrag').value || '').trim()
    .replace(/\s/g,'').replace(/€/g,'').replace(/\./g,'').replace(',','.');
  if (roh === '') return null;
  const n = Number(roh);
  if (!isFinite(n)) return null;
  return Math.round(n * 100) / 100;
}

function sichereStand(art){
  const betrag = leseBetrag();
  const datum  = document.getElementById('fDatum').value;

  if (betrag === null){ zeigeQuittung('Bitte einen Betrag eintragen.'); return; }
  if (betrag < 0){ zeigeQuittung('Der Betrag darf nicht negativ sein.'); return; }
  if (!datum){ zeigeQuittung('Bitte ein Datum wählen.'); return; }

  if (bearbeiteId){
    const s = daten.staende.find(x => x.id === bearbeiteId);
    if (s){ s.betrag = betrag; s.datum = datum; }
  } else {
    daten.staende.push({
      id: neueId('s'), art: art, datum: datum, betrag: betrag,
      erfasstAm: new Date().toISOString()
    });
  }
  const warFrei = freigeschaltet();
  const neu = pruefeMarken(datum);
  speichere();
  schliesseZettel();
  bearbeiteId = null;

  if (neu){
    /* Erst zeichnen, dann der Moment: der Ring läuft von seinem alten in
       seinen neuen Stand, während die Zeile erscheint (F5.1).           */
    zeichne();
    zeigeMoment(neu, !warFrei && freigeschaltet());
  } else {
    zeichne();
    zeigeQuittung('Eingetragen.');
  }
}

/* ══ Verlauf eines Standes ════════════════════════════════════════════ */

function oeffneStand(art){
  const a = ARTEN[art];
  const liste = eintraege(art);

  let html = '<div class="z-titel">' + a.name + '</div>';
  html += '<div class="z-unter">'
        + (liste.length === 0 ? 'Noch kein Eintrag.'
           : liste.length + (liste.length === 1 ? ' Eintrag' : ' Einträge')
             + ' · der jüngste gilt')
        + '</div>';

  if (liste.length === 0){
    html += '<div class="leer">Hier steht noch nichts.</div>';
  } else {
    html += '<div class="eintraege">';
    liste.forEach((s, i) => {
      html += '<div class="eintrag' + (i === 0 ? ' e-jetzt' : '') + '">';
      html += '<span class="e-datum">' + datumLang(s.datum) + '</span>';
      html += '<span class="e-betrag">' + euro(s.betrag) + '</span>';
      html += '<button onclick="oeffneEintrag(\'' + art + '\',\'' + s.id + '\')">ändern</button>';
      html += '<button onclick="loescheStand(this,\'' + s.id + '\',\'' + art + '\')">löschen</button>';
      html += '</div>';
    });
    html += '</div>';
  }

  html += '<div class="z-knoepfe">';
  html += '<button class="z-knopf leise" onclick="schliesseZettel()">Schließen</button>';
  html += '<button class="z-knopf primaer" onclick="oeffneEintrag(\'' + art + '\')">Stand eintragen</button>';
  html += '</div>';

  oeffneZettel(html);
}

/* Zweistufig: der erste Druck fragt, der zweite löscht. */
function loescheStand(knopf, id, art){
  if (knopf && knopf.dataset.bereit !== '1'){
    knopf.dataset.bereit = '1';
    knopf.textContent = 'wirklich?';
    setTimeout(() => {
      if (knopf.isConnected){ knopf.dataset.bereit = '0'; knopf.textContent = 'löschen'; }
    }, 3000);
    return;
  }
  daten.staende = daten.staende.filter(s => s.id !== id);
  /* erreichtAm wird beim Löschen NIE zurückgesetzt (Datei 04, Abschnitt 4). */
  speichere();
  zeichne();
  oeffneStand(art);
  zeigeQuittung('Gelöscht.');
}

/* ══ eBay-Erlöse ══════════════════════════════════════════════════════
   Datum und Betrag, mehr nicht (F2.1). Kein Artikel, keine Gebühren,
   keine Versandkosten — jedes weitere Feld kostet Pflegeaufwand, und
   der ist die wichtigste Kennzahl der App.                             */

let bearbeiteErloesId = null;

function erloeseSortiert(){
  return daten.erloese.slice().sort((a,b) =>
    b.datum.localeCompare(a.datum) || String(b.erfasstAm).localeCompare(String(a.erfasstAm)));
}

function oeffneErloese(){
  if (!freigeschaltet()){
    const fehlt = Math.max(0, 500 - aktuellerStand('notgroschen'));
    oeffneZettel('<div class="z-titel">Noch gesperrt</div>'
      + '<div class="z-unter">Verkaufserlöse warten auf die erste Marke.</div>'
      + '<p class="hinweis">Vor 500 € Notgroschen wird nicht investiert — also gibt es '
      + 'auch nichts einzuzahlen. Wer vorher verkauft, legt das Geld in den Notgroschen.'
      + '<br><br>Es fehlen noch <b>' + euro(fehlt) + '</b>.</p>'
      + '<div class="z-knoepfe">'
      + '<button class="z-knopf leise" onclick="schliesseZettel()">Schließen</button>'
      + '<button class="z-knopf primaer" onclick="oeffneEintrag(\'notgroschen\')">Notgroschen eintragen</button>'
      + '</div>');
    return;
  }

  const liste = erloeseSortiert();
  const summe = eingezahlt();
  const depot = aktuellerStand('depot');

  let html = '<div class="z-titel">Aus eBay eingezahlt</div>';
  html += '<div class="z-unter">'
        + (liste.length === 0 ? 'Noch kein Verkauf.'
           : liste.length + (liste.length === 1 ? ' Verkauf' : ' Verkäufe') + ' · zusammen ' + euro(summe))
        + '</div>';

  if (liste.length > 0 && hatStand('depot')){
    const diff = depot - summe;
    html += '<p class="hinweis">Im Depot stehen ' + euro(depot) + '. '
          + (Math.round(diff) === 0 ? 'Das ist genau der Einstand.'
             : (diff > 0 ? '<b>Der Markt hat ' + euro(diff) + ' draufgelegt.</b>'
                         : '<b>' + euro(-diff) + ' unter Einstand.</b>'))
          + '</p>';
  }

  if (liste.length === 0){
    html += '<div class="leer">Hier steht noch nichts.</div>';
  } else {
    html += '<div class="eintraege">';
    for (const e of liste){
      html += '<div class="eintrag">';
      html += '<span class="e-datum">' + datumLang(e.datum) + '</span>';
      html += '<span class="e-betrag">' + euro(e.betrag) + '</span>';
      html += '<button onclick="oeffneErloesEditor(\'' + e.id + '\')">ändern</button>';
      html += '<button onclick="loescheErloes(this,\'' + e.id + '\')">löschen</button>';
      html += '</div>';
    }
    html += '</div>';
  }

  html += '<div class="z-knoepfe">';
  html += '<button class="z-knopf leise" onclick="schliesseZettel()">Schließen</button>';
  html += '<button class="z-knopf primaer" onclick="oeffneErloesEditor(null)">Erlös eintragen</button>';
  html += '</div>';
  oeffneZettel(html);
}

function oeffneErloesEditor(id){
  bearbeiteErloesId = id || null;
  const e = id ? daten.erloese.find(x => x.id === id) : null;

  let html = '<div class="z-titel">' + (e ? 'Erlös ändern' : 'Erlös eintragen') + '</div>';
  html += '<div class="z-unter">Was bei einem Verkauf hereingekommen ist.</div>';
  html += '<label for="fBetrag">Betrag</label>';
  html += '<input type="text" inputmode="decimal" id="fBetrag" class="betragsfeld" '
        + 'value="' + (e ? String(e.betrag).replace('.',',') : '') + '" placeholder="0">';
  html += '<label for="fDatum">Datum</label>';
  html += '<input type="date" id="fDatum" value="' + escapeHtml(e ? e.datum : heute()) + '">';
  html += '<div class="z-knoepfe">';
  html += '<button class="z-knopf leise" onclick="oeffneErloese()">Abbrechen</button>';
  html += '<button class="z-knopf primaer" onclick="sichereErloes()">'
        + (e ? 'Ändern' : 'Eintragen') + '</button>';
  html += '</div>';
  oeffneZettel(html);
  setTimeout(() => { const f = document.getElementById('fBetrag'); if (f){ f.focus(); f.select(); } }, 340);
}

function sichereErloes(){
  const betrag = leseBetrag();
  const datum  = document.getElementById('fDatum').value;
  if (betrag === null){ zeigeQuittung('Bitte einen Betrag eintragen.'); return; }
  if (betrag <= 0){ zeigeQuittung('Ein Erlös ist größer als null.'); return; }
  if (!datum){ zeigeQuittung('Bitte ein Datum wählen.'); return; }

  if (bearbeiteErloesId){
    const e = daten.erloese.find(x => x.id === bearbeiteErloesId);
    if (e){ e.betrag = betrag; e.datum = datum; }
  } else {
    daten.erloese.push({ id: neueId('e'), datum: datum, betrag: betrag,
                         erfasstAm: new Date().toISOString() });
  }
  bearbeiteErloesId = null;
  speichere();
  zeichne();
  oeffneErloese();
  zeigeQuittung('Eingetragen.');
}

function loescheErloes(knopf, id){
  if (knopf.dataset.bereit !== '1'){
    knopf.dataset.bereit = '1';
    knopf.textContent = 'wirklich?';
    setTimeout(() => {
      if (knopf.isConnected){ knopf.dataset.bereit = '0'; knopf.textContent = 'löschen'; }
    }, 3000);
    return;
  }
  daten.erloese = daten.erloese.filter(x => x.id !== id);
  speichere();
  zeichne();
  oeffneErloese();
  zeigeQuittung('Gelöscht.');
}

/* ══ Marken verwalten ═════════════════════════════════════════════════ */

function oeffneMarken(){
  const liste = markenInReihenfolge();
  let html = '<div class="z-titel">Marken</div>';
  html += '<div class="z-unter">Die Etappen, an denen sich der Fortschritt bemisst.</div>';

  html += '<div class="eintraege">';
  for (const m of liste){
    const erreicht = !!m.erreichtAm;
    html += '<div class="mk' + (erreicht ? ' erreicht' : '') + '">';
    html += '<span class="mk-txt"><span class="mk-name">' + escapeHtml(markeName(m)) + '</span>'
          + '<div class="mk-unter">'
          + (erreicht ? 'erreicht am ' + datumLang(m.erreichtAm)
                      : (m.art === 'schulden' ? 'Schulden' : 'Notgroschen'))
          + '</div></span>';
    html += '<span class="mk-betrag">' + euro(m.betrag) + '</span>';
    if (!m.fest && !erreicht){
      html += '<button onclick="oeffneMarkeEditor(\'' + m.id + '\')">ändern</button>';
      html += '<button onclick="loescheMarke(this,\'' + m.id + '\')">löschen</button>';
    }
    html += '</div>';
  }
  html += '</div>';

  html += '<p class="hinweis">Puffer, Notgroschen voll und Schuldenfrei sind fest — '
        + 'sie bilden Regeln ab, keine Vorlieben. Alle übrigen setzt du selbst. '
        + 'Eine erreichte Marke bleibt erreicht, auch wenn der Stand später wieder steigt.</p>';

  html += '<div class="z-knoepfe" style="margin-bottom:9px">';
  html += '<button class="z-knopf leise" onclick="oeffneChronik()">Chronik'
        + (chronik().length ? ' (' + chronik().length + ')' : '') + '</button>';
  html += '<button class="z-knopf primaer" onclick="oeffneMarkeEditor(null)">Marke anlegen</button>';
  html += '</div>';
  html += '<div class="z-knoepfe">';
  html += '<button class="z-knopf leise" onclick="schliesseZettel()">Schließen</button>';
  html += '</div>';
  oeffneZettel(html);
}

function oeffneMarkeEditor(id){
  const m = id ? daten.marken.find(x => x.id === id) : null;
  let html = '<div class="z-titel">' + (m ? 'Marke ändern' : 'Neue Marke') + '</div>';
  html += '<div class="z-unter">Eine Stufe auf dem Weg beim Schuldenabbau.</div>';
  html += '<label for="fMarke">Schulden unter</label>';
  html += '<input type="text" inputmode="decimal" id="fMarke" class="betragsfeld" '
        + 'value="' + (m ? String(m.betrag).replace('.',',') : '') + '" placeholder="0">';
  html += '<p class="hinweis">Die Marke gilt als erreicht, sobald ein eingetragener '
        + 'Schuldenstand diesen Betrag erreicht oder unterschreitet.</p>';
  html += '<div class="z-knoepfe">';
  html += '<button class="z-knopf leise" onclick="oeffneMarken()">Abbrechen</button>';
  html += '<button class="z-knopf primaer" onclick="sichereMarke(' + (id ? "'"+id+"'" : 'null') + ')">'
        + (m ? 'Ändern' : 'Anlegen') + '</button>';
  html += '</div>';
  oeffneZettel(html);
  setTimeout(() => { const f = document.getElementById('fMarke'); if (f){ f.focus(); f.select(); } }, 340);
}

function sichereMarke(id){
  const roh = (document.getElementById('fMarke').value || '').trim()
    .replace(/\s/g,'').replace(/€/g,'').replace(/\./g,'').replace(',','.');
  const betrag = roh === '' ? NaN : Number(roh);
  if (!isFinite(betrag) || betrag < 0){ zeigeQuittung('Bitte einen Betrag eintragen.'); return; }

  const schon = daten.marken.some(x => x.art === 'schulden'
    && x.id !== id && Math.round(x.betrag) === Math.round(betrag));
  if (schon){ zeigeQuittung('Diese Marke gibt es schon.'); return; }

  if (id){
    const m = daten.marken.find(x => x.id === id);
    if (m && !m.fest) m.betrag = betrag;
  } else {
    daten.marken.push({ id: neueId('m'), art:'schulden', betrag: betrag,
                        fest:false, erreichtAm:null });
  }
  const neu = pruefeMarken(heute());
  speichere();
  zeichne();
  oeffneMarken();
  zeigeQuittung(neu ? 'Marke erreicht: ' + markeName(neu) : (id ? 'Geändert.' : 'Angelegt.'));
}

function loescheMarke(knopf, id){
  const m = daten.marken.find(x => x.id === id);
  if (!m || m.fest) return;
  if (knopf.dataset.bereit !== '1'){
    knopf.dataset.bereit = '1';
    knopf.textContent = 'wirklich?';
    setTimeout(() => {
      if (knopf.isConnected){ knopf.dataset.bereit = '0'; knopf.textContent = 'löschen'; }
    }, 3000);
    return;
  }
  daten.marken = daten.marken.filter(x => x.id !== id);
  speichere();
  zeichne();
  oeffneMarken();
  zeigeQuittung('Gelöscht.');
}

/* ══ Sicherung ════════════════════════════════════════════════════════ */

function oeffneVerwaltung(){
  let html = '<div class="z-titel">Sicherung</div>';
  html += '<div class="z-unter">Alle Daten liegen allein auf diesem Gerät.</div>';

  if (fehlerBeimLaden){
    html += '<p class="hinweis" style="color:var(--rot)"><b>Der Bestand ließ sich nicht lesen.</b><br>'
          + escapeHtml(fehlerBeimLaden)
          + '<br>Es wird nichts geschrieben, solange das so ist. '
          + 'Eine Sicherung einzulesen setzt den Bestand neu.</p>';
  }

  const z = zusammenfassung(daten);
  html += '<p class="hinweis">Im Bestand: ' + z.text + '</p>';

  html += '<div class="z-knoepfe" style="margin-bottom:9px">';
  html += '<button class="z-knopf primaer" onclick="gibSicherungAus()">Sicherung ausgeben</button>';
  html += '</div>';
  html += '<div class="z-knoepfe">';
  html += '<button class="z-knopf leise" onclick="waehleSicherung()">Sicherung einlesen</button>';
  html += '</div>';

  html += '<input type="file" id="fDatei" accept="application/json,.json" style="display:none">';

  html += '<div class="z-knoepfe" style="margin-top:16px">';
  html += '<button class="z-knopf leise" onclick="schliesseZettel()">Schließen</button>';
  html += '</div>';

  html += '<div class="fuss">Fassung ' + FASSUNG + ' · Datenschema ' + SCHEMA_VERSION + '</div>';

  oeffneZettel(html);

  const f = document.getElementById('fDatei');
  if (f) f.addEventListener('change', leseSicherung);
}

function zusammenfassung(d){
  const n = art => d.staende.filter(s => s.art === art).length;
  const alle = d.staende.map(s => s.datum).sort();
  const marken = (d.marken || []).filter(m => m.erreichtAm).length;
  const text = n('schulden') + ' × Schulden, ' + n('notgroschen') + ' × Notgroschen, '
             + n('depot') + ' × Depot, ' + (d.erloese || []).length + ' Erlöse'
             + (marken ? ', ' + marken + ' erreichte Marken' : '')
             + (alle.length ? ' · ' + datumLang(alle[0]) + ' bis ' + datumLang(alle[alle.length-1]) : '');
  return { text: text };
}

function gibSicherungAus(){
  try{
    const inhalt = JSON.stringify(daten, null, 2);
    const blob = new Blob([inhalt], { type:'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = 'soll-und-haben-sicherung-' + heute() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    daten.einstellungen.letzteSicherung = heute();
    speichere();
    zeigeQuittung('Sicherung ausgegeben.');
  }catch(e){
    zeigeQuittung('Das hat nicht geklappt.');
  }
}

function waehleSicherung(){ document.getElementById('fDatei').click(); }

function leseSicherung(ev){
  const datei = ev.target.files && ev.target.files[0];
  if (!datei) return;
  const leser = new FileReader();
  leser.onload = () => {
    let neu;
    try{
      neu = migriere(JSON.parse(leser.result));
    }catch(e){
      zeigeQuittung('Diese Datei ließ sich nicht lesen.');
      return;
    }
    zeigeVorschau(neu);
  };
  leser.readAsText(datei);
  ev.target.value = '';
}

/* Nichts geschieht ohne Bestätigung (Lastenheft F7.2). */
let vorschauBestand = null;
function zeigeVorschau(neu){
  vorschauBestand = neu;
  let html = '<div class="z-titel">Bestand ersetzen?</div>';
  html += '<div class="z-unter">Der gesamte bisherige Bestand wird ersetzt, nicht ergänzt.</div>';
  html += '<p class="hinweis"><b>Neu:</b><br>' + zusammenfassung(neu).text + '</p>';
  html += '<p class="hinweis"><b>Bisher:</b><br>' + zusammenfassung(daten).text + '</p>';
  html += '<div class="z-knoepfe">';
  html += '<button class="z-knopf leise" onclick="oeffneVerwaltung()">Abbrechen</button>';
  html += '<button class="z-knopf gefahr" onclick="uebernimmSicherung()">Ersetzen</button>';
  html += '</div>';
  oeffneZettel(html);
}

function uebernimmSicherung(){
  if (!vorschauBestand) return;
  daten = vorschauBestand;
  vorschauBestand = null;
  fehlerBeimLaden = null;
  pruefeMarken(heute());
  speichere();
  zeichne();
  schliesseZettel();
  zeigeQuittung('Bestand wiederhergestellt.');
}

/* ══ Start ════════════════════════════════════════════════════════════ */

zeichne();
if (fehlerBeimLaden) setTimeout(() => oeffneVerwaltung(), 400);
</script>
